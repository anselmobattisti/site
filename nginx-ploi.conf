# Configuração do nginx do site na Ploi (Manage > NGINX configuration): cole este arquivo inteiro.
# Base: o modelo que a Ploi gera, com as mudanças marcadas com "Site:". Testar antes de aplicar com nginx em Docker
# (nginx:alpine + esta configuração, com os includes da Ploi comentados e um .htpasswd de teste).
#
# Este arquivo é sempre escrito para o domínio principal (battisti.com.br), nunca para o staging: é a configuração que vai
# para o ar. No staging, troque o domínio só na cópia colada na Ploi, sem gravar no git.
# PENDENTE ao criar o site na Ploi: trocar __USUARIO_PLOI__ (usuário do site no servidor, ex.: cliente-Abc12).
# O certificado precisa ter o www.
# Ao publicar no domínio definitivo: REMOVER a senha do staging (map, auth_basic) e o X-Robots-Tag.

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/battisti.com.br/before/*;

# Site: senha de acesso enquanto o site estiver em desenvolvimento (staging). A validação do certificado
# (Let's Encrypt) fica sem senha; por map, e não por um location próprio, para não colidir com um location da Ploi.
map $uri $senha_staging {
    ~^/\.well-known/acme-challenge/  off;
    default                          "Site em desenvolvimento";
}

# Site: cache por tipo de arquivo, com um único add_header no server (um add_header dentro de um location anula os
# do server). HTML sempre revalidado; /_astro/ tem hash no nome, então pode ficar 1 ano.
map $uri $cache_control {
    ~^/_astro/                                          "public, max-age=31536000, immutable";
    ~*\.(?:jpe?g|png|gif|webp|avif|svg|ico)$            "public, max-age=604800";
    ~*\.(?:woff2?|ttf|otf)$                             "public, max-age=2592000";
    ~*\.(?:js|css)$                                     "public, max-age=86400";
    ~*\.(?:xml|txt|md)$                                 "public, max-age=3600";
    ~*\.pdf$                                            "public, max-age=86400";
    default                                             "no-cache";
}

# Site: política de segurança do navegador. Lista só o que o site usa: o próprio site e o Google Analytics (depois do
# "Accept"). 'unsafe-inline' porque o Astro embute CSS e scripts no HTML (e o Mermaid escreve estilos no diagrama).
# Ferramenta nova (mapa, vídeo incorporado) precisa entrar aqui, senão é bloqueada sem aviso nenhum na tela. Conferir
# sempre com o "Accept" clicado: o Analytics usa também analytics.google.com, www.google.com e doubleclick.
map $uri $politica_conteudo {
    default "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.google-analytics.com https://*.googletagmanager.com https://*.g.doubleclick.net https://www.google.com https://www.google.com.br; connect-src 'self' https://*.google-analytics.com https://analytics.google.com https://*.analytics.google.com https://*.googletagmanager.com https://stats.g.doubleclick.net https://www.google.com; frame-src 'none'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
}

# Site: tudo em HTTPS e sem www. A validação do certificado (Let's Encrypt) continua em HTTP.
# Se a Ploi já tiver gravado um redirecionamento igual em before/, o nginx avisa "conflicting server name" e usa o dela.
server {
    listen 80;
    listen [::]:80;
    server_name battisti.com.br www.battisti.com.br;
    root /home/__USUARIO_PLOI__/battisti.com.br/public;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }
    location / {
        return 301 https://battisti.com.br$request_uri;
    }
}

server {
    #listen 80;
    #listen [::]:80;

    root /home/__USUARIO_PLOI__/battisti.com.br/public;
    server_name battisti.com.br www.battisti.com.br;

    # Site: www vai para o domínio sem www.
    if ($host ~* ^www\.) { return 301 https://battisti.com.br$request_uri; }

    include /etc/nginx/ssl/battisti.com.br;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_dhparam /etc/nginx/dhparams.pem;

    # Site: o site é estático; o index.php do modelo não existe.
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Cache-Control $cache_control;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $politica_conteudo always;
    # Site: sem includeSubDomains de propósito: subdomínios (webmail, por exemplo) podem ainda abrir em http.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Site: staging com senha (usuários no .htpasswd-staging, criado por SSH, fora do git e da pasta pública) e fora
    # do Google. Criar: printf 'cliente:%s\n' "$(openssl passwd -apr1)" > ~/.htpasswd-staging
    auth_basic $senha_staging;
    auth_basic_user_file /home/__USUARIO_PLOI__/.htpasswd-staging;
    add_header X-Robots-Tag "noindex, nofollow" always;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/markdown text/xml application/xml application/atom+xml application/javascript application/json image/svg+xml;

    # Ploi Configuration, do not remove!
    include /etc/nginx/ploi/battisti.com.br/server/*;

    # Site: redirecionamentos 301 do site antigo (11ty). As páginas, o /feed.xml, os documentos das palestras
    # (/talks/<palestra>/*.pdf) e a imagem de compartilhamento (/img/share.jpg) ficaram nos mesmos endereços. Só mudou
    # o sitemap, que agora tem um índice.
    location = /sitemap.xml { return 301 /sitemap-index.xml; }

    # Site: pastas que só guardam arquivos (documentos de uma palestra sem página, imagens): sem index.html, o nginx
    # responderia 403. Vão para a página 404 do site.
    error_page 403 =404 /404.html;

    # Site: cada página é um index.html na sua pasta (/servicos/ → /servicos/index.html), e o que não existe cai na
    # página 404 do site (o modelo da Ploi manda tudo para /index.php).
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    access_log off;
    error_log  /var/log/nginx/battisti.com.br-error.log error;

    location = /favicon.ico { access_log off; log_not_found off; return 301 /favicon.svg; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Versão .md de cada página, para agentes de IA (integracoes/paginas-markdown.mjs).
    # O mime.types do nginx não conhece o .md (sairia como download): "types {}" vazio + default_type só aqui.
    location ~* \.md$ {
        types { }
        default_type text/markdown;
        charset_types text/markdown;
        try_files $uri =404;
    }

    # Site: o site não usa PHP (não tem formulário): nenhum arquivo .php é executado.
    location ~ \.php$ {
        return 404;
    }

    # Feed Atom: o mime.types do nginx serve .xml como text/xml; os leitores de feed esperam application/atom+xml.
    location = /feed.xml {
        types { }
        default_type application/atom+xml;
        charset_types application/atom+xml;
    }

    # Arquivos ocultos (.env, .git) bloqueados; .well-known liberado para o certificado (Let's Encrypt).
    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# Ploi Webserver Configuration, do not remove!
include /etc/nginx/ploi/battisti.com.br/after/*;
